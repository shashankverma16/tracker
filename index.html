<style>

    --card: #FFFFFF;
    --ink: #33424D;
    --ink-soft: #7B93A3;
    --pink: #6FA8DC;
    --pink-deep: #4A8AC2;

    --cream-border: #DCEAF6;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17212B;
      --card: #1F2B37;
      --ink: #E7F0F7;
      --ink-soft: #8FA6B8;
      --cream-border: #2B3944;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17212B;
    --card: #1F2B37;
    --ink: #E7F0F7;
    --ink-soft: #8FA6B8;
    --cream-border: #2B3944;
  }
  body { background: var(--bg); color: var(--ink); font-family: 'Nunito', sans-serif; }

  .card { background: var(--card); border: 1px solid var(--cream-border); }
  .liquid-rect { transition: y 1.1s cubic-bezier(.4,0,.2,1), height 1.1s cubic-bezier(.4,0,.2,1), fill 0.5s ease; }
  .wave-rect { transition: y 1.1s cubic-bezier(.4,0,.2,1); }
  .modal-enter { animation: modalIn .25s ease-out; }

  .backdrop-enter { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity:0;} to { opacity:1;} }
  .pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0%{ transform: scale(.9); opacity:.5;} 100%{ transform: scale(1); opacity:1;} }
  .scrollbar-thin::-webkit-scrollbar { width: 5px; height: 5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--cream-border); border-radius: 10px; }
  input[type="time"]::-webkit-calendar-picker-indicator { opacity: 0.6; }
  .toast { animation: toastIn .3s ease-out, toastOut .3s ease-in 1.7s forwards; }
  @keyframes toastIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform: translateY(0);} }
  @keyframes toastOut { to { opacity:0; transform: translateY(10px);} }

<body class="min-h-screen font-nunito">

<div id="app" class="max-w-md mx-auto min-h-screen pb-10 px-4"></div>

<div id="toastHost" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 px-4 w-full max-w-md pointer-events-none"></div>

<script>
/* ---------------- Storage ---------------- */
const STORE_KEY = 'milkTrackerData_v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { console.error('load error', e); return {}; }
}
function saveStore(store) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch(e) { console.error('save error', e); showToast('Could not save — storage full?'); }
  scheduleAutoSync();
}

let store = loadStore(); // { "YYYY-MM-DD": [ {id, type, amount, time (HH:MM, 24h)} ] }

/* ---------------- Mother's name ---------------- */
const NAME_KEY = 'milkTrackerMotherName_v1';
function loadMotherName(){ try { return localStorage.getItem(NAME_KEY) || ''; } catch(e){ return ''; } }
function saveMotherName(name){ try { localStorage.setItem(NAME_KEY, name); } catch(e){ console.error(e); } }
let motherName = loadMotherName();

/* ---------------- Theme ---------------- */
const THEME_KEY = 'milkTrackerTheme_v1';
function loadTheme(){ try { return localStorage.getItem(THEME_KEY) || 'system'; } catch(e){ return 'system'; } }
function saveTheme(t){ try { localStorage.setItem(THEME_KEY, t); } catch(e){ console.error(e); } }
function applyTheme(t){
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
}
let currentTheme = loadTheme();
applyTheme(currentTheme);

/* ==================================================================
   GOOGLE DRIVE SYNC
   ------------------------------------------------------------------
   SETUP REQUIRED — see README.md for the full walkthrough. In short:
   1. Create a project in Google Cloud Console.
   2. Enable the "Google Drive API".
   3. Configure the OAuth consent screen (scope: drive.file).
   4. Create an OAuth 2.0 Client ID (type: Web application) and add
      your site's URL (e.g. https://yourname.github.io) — and
      http://localhost:PORT for local testing — under
      "Authorized JavaScript origins".
   5. Paste that Client ID below.
   ================================================================== */
const GOOGLE_CLIENT_ID = '1049335047350-1gsju0s1ef8frihvec7tnvhl8uijbri8.apps.googleusercontent.com.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_NAME = 'milk-tracker-data.json';

let driveTokenClient = null;
let driveAccessToken = null;
let driveTokenExpiresAt = 0;
let driveFileId = localStorage.getItem('milkTrackerDriveFileId_v1') || null;
let driveEmail = localStorage.getItem('milkTrackerDriveEmail_v1') || null;
let autoSyncEnabled = localStorage.getItem('milkTrackerAutoSync_v1') === 'true';
let lastSyncedAt = localStorage.getItem('milkTrackerLastSync_v1') || null;
let syncStatus = 'idle'; // idle | syncing | success | error
let syncStatusMsg = '';
let driveConfigured = !GOOGLE_CLIENT_ID.startsWith('YOUR_GOOGLE_CLIENT_ID');

// Poll for the Google Identity Services script (loaded async/defer) then init once.
let gisPoll = setInterval(() => {
  if (window.google && google.accounts && google.accounts.oauth2) {
    clearInterval(gisPoll);
    initGoogleDrive();
  }
}, 250);

function initGoogleDrive(){
  if (!driveConfigured) return; // no client id pasted in yet — sync UI will explain this
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp.error){
        syncStatus = 'error';
        syncStatusMsg = resp.error === 'access_denied' ? 'Access was declined' : 'Connection failed';
        render();
        return;
      }
      driveAccessToken = resp.access_token;
      driveTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
      fetchDriveUserInfo();
    }
  });
}

function connectDrive(){
  if (!driveConfigured){ showToast('Add your Google Client ID first — see README.md'); return; }
  if (!driveTokenClient){ showToast('Still loading Google Sign-In — try again in a moment'); return; }
  driveTokenClient.requestAccessToken({ prompt: 'consent' });
}

function disconnectDrive(){
  if (driveAccessToken && window.google && google.accounts && google.accounts.oauth2){
    google.accounts.oauth2.revoke(driveAccessToken, () => {});
  }
  driveAccessToken = null;
  driveTokenExpiresAt = 0;
  driveEmail = null;
  localStorage.removeItem('milkTrackerDriveEmail_v1');
  syncStatus = 'idle'; syncStatusMsg = '';
  showToast('Disconnected from Google Drive');
  render();
}

async function fetchDriveUserInfo(){
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + driveAccessToken }
    });
    const data = await res.json();
    driveEmail = data.email || 'Connected';
  } catch(e){
    driveEmail = 'Connected';
  }
  localStorage.setItem('milkTrackerDriveEmail_v1', driveEmail);
  showToast('Connected to Google Drive');
  render();
  if (autoSyncEnabled) syncToDrive();
}

// Ensures we have a live access token, trying a silent (no-UI) refresh first.
function ensureDriveToken(interactive){
  if (driveAccessToken && Date.now() < driveTokenExpiresAt - 30000) return Promise.resolve(true);
  if (!driveTokenClient) return Promise.resolve(false);
  return new Promise((resolve) => {
    driveTokenClient.callback = (resp) => {
      if (resp.error){ resolve(false); return; }
      driveAccessToken = resp.access_token;
      driveTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
      resolve(true);
    };
    driveTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}

async function findDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`, {
    headers: { Authorization: 'Bearer ' + driveAccessToken }
  });
  if (!res.ok) throw new Error('drive_list_failed');
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

async function syncToDrive(){
  if (!driveConfigured) return;
  const ok = await ensureDriveToken(false);
  if (!ok){ syncStatus = 'error'; syncStatusMsg = 'Reconnect Google Drive to sync'; render(); return; }

  syncStatus = 'syncing'; syncStatusMsg = ''; render();
  try {
    const payload = JSON.stringify({ store, motherName, exportedAt: new Date().toISOString() }, null, 2);
    let fileId = driveFileId;
    if (!fileId){
      const existing = await findDriveFile();
      if (existing) fileId = existing.id;
    }

    if (fileId){
      const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: 'Bearer ' + driveAccessToken, 'Content-Type': 'application/json' },
        body: payload
      });
      if (!res.ok) throw new Error('upload_failed');
    } else {
      const boundary = 'milktracker' + Date.now();
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + driveAccessToken, 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      if (!res.ok) throw new Error('create_failed');
      const created = await res.json();
      fileId = created.id;
    }

    driveFileId = fileId;
    localStorage.setItem('milkTrackerDriveFileId_v1', fileId);
    lastSyncedAt = new Date().toISOString();
    localStorage.setItem('milkTrackerLastSync_v1', lastSyncedAt);
    syncStatus = 'success'; syncStatusMsg = 'Synced';
    render();
  } catch(e){
    console.error(e);
    syncStatus = 'error'; syncStatusMsg = 'Sync failed — try again';
    render();
  }
}

async function restoreFromDrive(){
  if (!driveConfigured){ showToast('Add your Google Client ID first — see README.md'); return; }
  const ok = await ensureDriveToken(false);
  if (!ok){ showToast('Connect Google Drive first'); return; }

  try {
    let fileId = driveFileId;
    if (!fileId){
      const existing = await findDriveFile();
      if (!existing){ showToast('No backup found on Drive yet'); return; }
      fileId = existing.id;
      driveFileId = fileId;
      localStorage.setItem('milkTrackerDriveFileId_v1', fileId);
    }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: 'Bearer ' + driveAccessToken }
    });
    if (!res.ok) throw new Error('download_failed');
    const data = await res.json();

    if (!confirm('This replaces all data on this device with your Google Drive backup. Continue?')) return;
    store = data.store || {};
    saveStore(store);
    if (data.motherName){ motherName = data.motherName; saveMotherName(motherName); }
    showToast('Restored from Google Drive');
    render();
  } catch(e){
    console.error(e);
    showToast('Restore failed — try again');
  }
}

function toggleAutoSync(){
  autoSyncEnabled = !autoSyncEnabled;
  localStorage.setItem('milkTrackerAutoSync_v1', String(autoSyncEnabled));
  if (autoSyncEnabled) syncToDrive();
  render();
}

let autoSyncTimer = null;
function scheduleAutoSync(){
  if (typeof autoSyncEnabled === 'undefined' || !autoSyncEnabled || !driveAccessToken) return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(() => syncToDrive(), 2500);
}

/* ---------------- Motivational messages ---------------- */
const MOTIVATIONS = [
  "You're doing an amazing job — one feed at a time.",
  "Every drop counts. You've got this.",
  "Some days are messy — that's okay, don't give up.",
  "Your baby is lucky to have you. Keep going.",
  "Feeding struggles don't define you as a mother.",
  "Trust yourself — you know your baby better than anyone.",
  "It's okay to ask for help. You're still doing great.",
  "This phase is hard, but it won't last forever.",
  "You are enough, exactly as you are today.",
  "Progress, not perfection. You're getting there.",
  "Take a breath — you're already doing so well.",
  "Every baby is different. You're learning together.",
  "Be gentle with yourself today. You deserve it too.",
  "Small steps still move you forward. Keep at it.",
  "You showed up today, and that matters."
];
function getMotivationForToday(){
  const d = new Date();
  const dayOfYear = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
  return MOTIVATIONS[dayOfYear % MOTIVATIONS.length];
}

/* ---------------- Helpers ---------------- */
function pad(n){ return n.toString().padStart(2,'0'); }
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function keyToDate(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateLong(key){
  return keyToDate(key).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
}
function formatDateShort(key){
  return keyToDate(key).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function to12h(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad(m)} ${period}`;
}
function nowHHMM(){
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function dayEntries(key){ return (store[key] || []).slice().sort((a,b)=> a.time.localeCompare(b.time)); }
function dayTotals(key){
  const entries = store[key] || [];
  let formula = 0, mother = 0;
  entries.forEach(e => { if (e.type === 'formula') formula += e.amount; else mother += e.amount; });
  return { formula, mother, total: formula + mother, count: entries.length };
}

const TARGET_MIN = 450, TARGET_MAX = 600;

/* ---------------- Toast ---------------- */
function showToast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast bg-[var(--ink)] text-[var(--bg)] text-sm font-medium px-4 py-2 rounded-full shadow-lg';
  el.style.color = 'var(--bg)';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=> el.remove(), 2000);
}

/* ---------------- State ---------------- */
let view = motherName ? 'home' : 'onboarding'; // onboarding | home | archive
let modal = null; // null | {mode:'add'|'edit', entry?} | {mode:'rename'}
let expandedArchiveKeys = new Set(); // date keys currently showing their feed list
let animatedOnce = { key: null };

/* ---------------- Downloads capability ---------------- */
let downloadsNS = null;
(async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      downloadsNS = await window.claude.use('downloads');
    }
  } catch(e) { downloadsNS = null; }
})();

async function exportDay(key){
  const entries = dayEntries(key);
  if (entries.length === 0){ showToast('No entries for this day'); return; }
  const totals = dayTotals(key);
  const dateShort = formatDateShort(key).replace(/ /g,'-');

  const rows = [
    ['Date','Time','Milk Type','Amount (ml)'],
  ];
  entries.forEach(e => {
    rows.push([formatDateShort(key), to12h(e.time), e.type === 'formula' ? 'Formula Milk' : "Mother's Milk", e.amount]);
  });
  rows.push([]);
  rows.push(['Daily Formula Milk Total', '', '', totals.formula]);
  rows.push(['Daily Mother\'s Milk Total', '', '', totals.mother]);
  rows.push(['Daily Total Milk', '', '', totals.total]);
  rows.push(['Target Range', '', '', `${TARGET_MIN}-${TARGET_MAX} ml`]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:12},{wch:16},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Feeding Log');
  const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const blob = new Blob([wbout], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const filename = `Milk-Report-${dateShort}.xlsx`;

  if (downloadsNS) {
    try {
      await downloadsNS.save({ filename, data: blob });
      showToast('Report saved');
    } catch(err){
      if (err && err.code === 'declined') return;
      showToast('Could not save the file');
    }
  } else {
    // fallback: plain anchor download (works when not in a sandboxed artifact view)
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch(e){ showToast('Download unavailable here'); }
  }
}

/* ---------------- Rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  if (view === 'onboarding'){
    app.innerHTML = renderOnboarding();
    attachOnboardingHandlers();
    return;
  }
  if (view === 'sync'){
    app.innerHTML = renderSync();
    attachSyncHandlers();
    return;
  }
  app.innerHTML = view === 'home' ? renderHome() : renderArchive();
  attachHomeOrArchiveHandlers();
  if (modal) renderModal();
  animateBottle();
}

function renderOnboarding(){
  return `
    <div class="min-h-screen flex items-center justify-center px-2">
      <div class="card rounded-3xl p-7 w-full pop shadow-sm text-center">
        <div class="text-4xl mb-3">🍼💙</div>
        <h1 class="font-display text-xl font-bold mb-1">Welcome!</h1>
        <p class="text-sm text-[var(--ink-soft)] mb-6">What's your name? We'll use it to greet you each time you open the tracker.</p>
        <input id="motherNameInput" type="text" placeholder="Your name" maxlength="40"
          class="w-full px-4 py-3 rounded-xl border-2 border-[var(--cream-border)] bg-transparent font-display font-bold text-lg text-center focus:outline-none focus:border-[var(--pink)] mb-4" />
        <button id="startBtn" class="w-full bg-[var(--pink)] hover:bg-[var(--pink-deep)] active:scale-[0.98] transition text-white font-display font-bold py-3 rounded-xl">
          Continue
        </button>
      </div>
    </div>
  `;
}

function attachOnboardingHandlers(){
  const input = document.getElementById('motherNameInput');
  const startBtn = document.getElementById('startBtn');
  input.focus();
  function submit(){
    const name = input.value.trim();
    if (!name){ showToast('Please enter your name'); return; }
    motherName = name;
    saveMotherName(name);
    view = 'home';
    render();
  }
  startBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') submit(); });
}

function renderSync(){
  const connected = !!driveEmail;
  const statusDot = { idle:'#9CA3AF', syncing:'#F0A868', success:'#8FD3A6', error:'#E88AA3' }[syncStatus] || '#9CA3AF';
  const statusLabel = { idle:'', syncing:'Syncing…', success:'Synced', error: syncStatusMsg || 'Error' }[syncStatus] || '';

  return `
    <header class="pt-8 pb-4 flex items-center gap-3">
      <button id="syncBackBtn" class="w-9 h-9 rounded-full flex items-center justify-center card">←</button>
      <h1 class="font-display text-2xl font-bold">Google Drive Sync</h1>
    </header>

    ${!driveConfigured ? `
      <div class="card rounded-2xl p-4 mb-4" style="border-color:#F0A86855">
        <p class="text-sm font-semibold mb-1">⚠️ Setup needed</p>
        <p class="text-xs text-[var(--ink-soft)] leading-relaxed">Drive sync needs a free Google OAuth Client ID pasted into the code before it can connect. See <span class="font-semibold">README.md</span> in the project for step-by-step instructions.</p>
      </div>
    ` : ''}

    <section class="card rounded-3xl p-5">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-11 h-11 rounded-full flex items-center justify-center text-xl flex-shrink-0" style="background:var(--pink)22">☁️</div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-sm">${connected ? 'Connected' : 'Not connected'}</p>
          <p class="text-xs text-[var(--ink-soft)] truncate">${connected ? driveEmail : 'Connect your Google account to back up feeds'}</p>
        </div>
      </div>
      <button id="driveConnectBtn" class="w-full font-display font-bold text-sm py-3 rounded-xl transition active:scale-[0.98] ${connected ? 'border-2 border-[var(--cream-border)] text-[var(--ink-soft)]' : 'text-white'}" style="${connected ? '' : 'background:var(--pink)'}">
        ${connected ? 'Disconnect' : 'Connect Google Drive'}
      </button>
    </section>

    <section class="card rounded-3xl p-5 mt-4">
      <div class="flex items-center justify-between mb-1">
        <div>
          <p class="font-semibold text-sm">Auto-sync</p>
          <p class="text-xs text-[var(--ink-soft)]">Pushes changes to Drive a couple seconds after each edit</p>
        </div>
        <button id="autoSyncToggle" class="w-12 h-7 rounded-full flex-shrink-0 flex items-center px-0.5 transition" style="background:${autoSyncEnabled ? 'var(--pink)' : 'var(--cream-border)'}">
          <span class="w-6 h-6 bg-white rounded-full shadow transition-transform ${autoSyncEnabled ? 'translate-x-5' : ''}"></span>
        </button>
      </div>
    </section>

    <section class="mt-4 space-y-2">
      <button id="syncNowBtn" class="w-full bg-[var(--pink)] hover:bg-[var(--pink-deep)] active:scale-[0.98] transition text-white font-display font-bold text-sm py-3 rounded-xl">
        ⬆ Sync Now
      </button>
      <button id="restoreBtn" class="w-full border-2 border-[var(--cream-border)] text-[var(--ink-soft)] font-display font-bold text-sm py-3 rounded-xl transition active:scale-[0.98]">
        ⬇ Restore from Drive
      </button>
    </section>

    <div class="mt-4 text-center">
      ${statusLabel ? `
        <p class="text-xs font-semibold inline-flex items-center gap-1.5" style="color:${syncStatus==='error' ? '#D97E32' : 'var(--ink-soft)'}">
          <span class="w-2 h-2 rounded-full" style="background:${statusDot}"></span>${statusLabel}
        </p>
      ` : ''}
      ${lastSyncedAt ? `<p class="text-[11px] text-[var(--ink-soft)] mt-1">Last synced ${new Date(lastSyncedAt).toLocaleString()}</p>` : ''}
    </div>
  `;
}

function attachSyncHandlers(){
  document.getElementById('syncBackBtn').addEventListener('click', () => { view = 'home'; render(); });
  document.getElementById('driveConnectBtn').addEventListener('click', () => {
    if (driveEmail) disconnectDrive(); else connectDrive();
  });
  document.getElementById('autoSyncToggle').addEventListener('click', toggleAutoSync);
  document.getElementById('syncNowBtn').addEventListener('click', syncToDrive);
  document.getElementById('restoreBtn').addEventListener('click', restoreFromDrive);
}

function progressColor(total){
  if (total < TARGET_MIN) return { bar: '#9ECBEB', liquid: '#AEDFF7', text: 'var(--ink-soft)' };
  if (total <= TARGET_MAX) return { bar: '#8FD3A6', liquid: '#B9E8C6', text: '#4E9C6B' };
  return { bar: '#F0A868', liquid: '#F7C08C', text: '#D97E32' };
}

function themeToggleHTML(){
  const opts = [ ['light','☀️'], ['dark','🌙'], ['system','🖥️'] ];
  return `
    <div class="flex items-center gap-0.5 card rounded-full p-1 flex-shrink-0">
      ${opts.map(([key,icon]) => `
        <button data-theme-btn="${key}" title="${key[0].toUpperCase()+key.slice(1)} mode"
          class="w-8 h-8 rounded-full flex items-center justify-center text-sm transition ${currentTheme===key ? 'bg-[var(--pink)]' : ''}">
          ${icon}
        </button>
      `).join('')}
    </div>
  `;
}

function renderHome(){
  const key = todayKey();
  const totals = dayTotals(key);
  const colors = progressColor(totals.total);
  const pct = Math.min(100, Math.round((totals.total / TARGET_MAX) * 100));
  const entries = dayEntries(key);
  const statusMsg = totals.total === 0
    ? 'No feedings logged yet today'
    : totals.total < TARGET_MIN
      ? `${TARGET_MIN - totals.total} ml to reach the minimum target`
      : totals.total <= TARGET_MAX
        ? 'Within today\'s target range 🎉'
        : `${totals.total - TARGET_MAX} ml over the target range`;

  return `
    <header class="pt-8 pb-4 flex items-start justify-between gap-3">
      <div>
        <p class="text-sm text-[var(--ink-soft)] font-medium">${formatDateLong(key)}</p>
        <h1 class="font-display text-2xl font-bold mt-0.5">Hi ${escapeHtml(motherName)} 💙</h1>
        <p class="text-xs text-[var(--ink-soft)] font-medium mt-1 max-w-[230px] leading-snug">${getMotivationForToday()}</p>
      </div>
      <div class="flex flex-col items-end gap-2 flex-shrink-0">
        ${themeToggleHTML()}
        <div class="flex items-center gap-2">
          <button id="syncOpenBtn" class="w-8 h-8 rounded-full flex items-center justify-center text-base card relative" title="Google Drive sync">
            ☁️${autoSyncEnabled && driveEmail ? '<span class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full" style="background:#8FD3A6"></span>' : ''}
          </button>
          <button id="renameBtn" class="text-xl leading-none" title="Edit name">🍼</button>
        </div>
      </div>
    </header>

    <section class="card rounded-3xl p-6 shadow-sm">
      <div class="flex items-center justify-between mb-1">
        <span class="text-sm font-semibold text-[var(--ink-soft)]">Today's Total</span>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full" style="background:${colors.liquid}22; color:${colors.text}">${TARGET_MIN}–${TARGET_MAX} ml target</span>
      </div>
      <div class="flex items-end gap-2 mb-4">
        <span class="font-display text-4xl font-bold">${totals.total}</span>
        <span class="text-base text-[var(--ink-soft)] pb-1">ml</span>
      </div>

      <div class="flex items-center gap-6">
        <div class="flex-shrink-0">
          ${bottleSVG(colors)}
        </div>
        <div class="flex-1 space-y-3">
          <div>
            <div class="flex justify-between text-xs font-semibold text-[var(--ink-soft)] mb-1">
              <span>Progress</span><span>${pct}%</span>
            </div>
            <div class="h-2.5 rounded-full bg-[var(--cream-border)] overflow-hidden">
              <div class="h-full rounded-full transition-all duration-700 ease-out" style="width:${pct}%; background:${colors.bar}"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div class="rounded-2xl p-2.5" style="background:${colors.liquid}18">
              <p class="text-[11px] font-semibold text-[var(--ink-soft)]">Formula</p>
              <p class="font-display font-bold text-lg">${totals.formula} <span class="text-xs font-medium text-[var(--ink-soft)]">ml</span></p>
            </div>
            <div class="rounded-2xl p-2.5" style="background:${colors.liquid}18">
              <p class="text-[11px] font-semibold text-[var(--ink-soft)]">Mother's</p>
              <p class="font-display font-bold text-lg">${totals.mother} <span class="text-xs font-medium text-[var(--ink-soft)]">ml</span></p>
            </div>
          </div>
          <p class="text-xs font-medium" style="color:${colors.text}">${statusMsg}</p>
        </div>
      </div>
    </section>

    <button id="addBtn" class="w-full mt-4 bg-[var(--pink)] hover:bg-[var(--pink-deep)] active:scale-[0.98] transition text-white font-display font-bold text-base py-3.5 rounded-2xl shadow-sm flex items-center justify-center gap-2">
      <span class="text-xl leading-none">+</span> Add Milk
    </button>

    <section class="mt-6">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-display font-bold text-base">Today's Feedings</h2>
        <span class="text-xs text-[var(--ink-soft)] font-medium">${entries.length} entr${entries.length===1?'y':'ies'}</span>
      </div>
      ${entries.length === 0 ? `
        <div class="card rounded-2xl p-6 text-center">
          <p class="text-sm text-[var(--ink-soft)]">No feedings yet — tap "Add Milk" to log the first one.</p>
        </div>
      ` : `
        <div class="space-y-2">
          ${entries.map(e => entryRow(e)).join('')}
        </div>
      `}
    </section>

    <button id="archiveBtn" class="w-full mt-6 text-sm font-semibold text-[var(--ink-soft)] py-2.5 rounded-xl border border-[var(--cream-border)] hover:bg-[var(--cream-border)]/40 transition">
      View Archive
    </button>
  `;
}

function entryRow(e){
  const isFormula = e.type === 'formula';
  return `
    <div class="card rounded-2xl p-3.5 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg flex-shrink-0" style="background:${isFormula ? '#6FA8DC22' : '#4A6FA522'}">
        ${isFormula ? '🍼' : '🤱'}
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm truncate">${isFormula ? 'Formula Milk' : "Mother's Milk"}</p>
        <p class="text-xs text-[var(--ink-soft)]">${to12h(e.time)}</p>
      </div>
      <p class="font-display font-bold text-base flex-shrink-0">${e.amount} <span class="text-xs font-medium text-[var(--ink-soft)]">ml</span></p>
      <div class="flex items-center gap-1 flex-shrink-0">
        <button data-edit="${e.id}" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[var(--cream-border)] transition text-[var(--ink-soft)]" title="Edit">✎</button>
        <button data-delete="${e.id}" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[var(--cream-border)] transition text-[var(--ink-soft)]" title="Delete">🗑</button>
      </div>
    </div>
  `;
}

function bottleSVG(colors){
  // body region: y 50 to 270 (height 220), x 40-160
  const bodyTop = 55, bodyBottom = 268, bodyHeight = bodyBottom - bodyTop;
  const key = todayKey();
  const totals = dayTotals(key);
  const cappedTotal = Math.min(totals.total, TARGET_MAX);
  const fillFrac = TARGET_MAX > 0 ? cappedTotal / TARGET_MAX : 0;
  const liquidHeight = fillFrac * bodyHeight;
  const liquidY = bodyBottom - liquidHeight;

  // target markers
  const minY = bodyBottom - (TARGET_MIN / TARGET_MAX) * bodyHeight;
  const maxY = bodyTop;

  return `
  <svg width="108" height="170" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="bottleClip">
        <rect x="42" y="${bodyTop}" width="116" height="${bodyHeight+2}" rx="26" ry="26"/>
      </clipPath>
    </defs>
    <!-- cap -->
    <rect x="72" y="8" width="56" height="16" rx="6" fill="var(--cream-border)"/>
    <!-- neck -->
    <rect x="82" y="20" width="36" height="34" rx="6" fill="none" stroke="var(--cream-border)" stroke-width="4"/>
    <!-- body outline -->
    <rect x="42" y="${bodyTop}" width="116" height="${bodyHeight}" rx="26" ry="26" fill="none" stroke="var(--cream-border)" stroke-width="4"/>
    <!-- liquid -->
    <g clip-path="url(#bottleClip)">
      <rect class="liquid-rect" x="42" y="${liquidY}" width="116" height="${liquidHeight+4}" fill="${colors.liquid}"/>
      <rect class="wave-rect" x="42" y="${liquidY}" width="116" height="6" fill="${colors.bar}" opacity="0.55"/>
    </g>
    <!-- target guide lines -->
    <line x1="36" y1="${minY}" x2="42" y2="${minY}" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="2 2"/>
    <line x1="158" y1="${maxY}" x2="164" y2="${maxY}" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="2 2"/>
  </svg>
  `;
}

function animateBottle(){
  // Force fill from 0 -> current on first paint of the day for a nice grow animation
  if (view !== 'home') return;
  const key = todayKey();
  const svgWrap = document.querySelector('#app svg');
  if (!svgWrap) return;
  const rect = svgWrap.querySelector('.liquid-rect');
  const wave = svgWrap.querySelector('.wave-rect');
  if (!rect) return;

  const targetY = rect.getAttribute('y');
  const targetH = rect.getAttribute('height');
  const bodyBottom = 268;

  // start empty
  rect.setAttribute('y', bodyBottom);
  rect.setAttribute('height', 0);
  if (wave) wave.setAttribute('y', bodyBottom);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      rect.setAttribute('y', targetY);
      rect.setAttribute('height', targetH);
      if (wave) wave.setAttribute('y', targetY);
    });
  });
}

function renderArchive(){
  const keys = Object.keys(store).filter(k => k !== todayKey() && (store[k]||[]).length > 0).sort((a,b)=> b.localeCompare(a));
  return `
    <header class="pt-8 pb-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <button id="backBtn" class="w-9 h-9 rounded-full flex items-center justify-center card">←</button>
        <h1 class="font-display text-2xl font-bold">Archive</h1>
      </div>
      ${themeToggleHTML()}
    </header>

    ${keys.length === 0 ? `
      <div class="card rounded-2xl p-8 text-center mt-4">
        <p class="text-sm text-[var(--ink-soft)]">No past days recorded yet.</p>
      </div>
    ` : `
      <div class="space-y-3">
        ${keys.map(k => archiveCard(k)).join('')}
      </div>
    `}
  `;
}

function archiveCard(key){
  const t = dayTotals(key);
  const isExpanded = expandedArchiveKeys.has(key);
  const entries = isExpanded ? dayEntries(key) : [];
  return `
    <div class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2">
        <p class="font-display font-bold text-sm">${formatDateLong(key)}</p>
        <span class="text-xs font-semibold text-[var(--ink-soft)]">${t.count} feeding${t.count===1?'':'s'}</span>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-3">
        <div class="rounded-xl p-2 bg-[var(--cream-border)]/40 text-center">
          <p class="text-[10px] text-[var(--ink-soft)] font-semibold">Formula</p>
          <p class="font-display font-bold text-sm">${t.formula}</p>
        </div>
        <div class="rounded-xl p-2 bg-[var(--cream-border)]/40 text-center">
          <p class="text-[10px] text-[var(--ink-soft)] font-semibold">Mother's</p>
          <p class="font-display font-bold text-sm">${t.mother}</p>
        </div>
        <div class="rounded-xl p-2 bg-[var(--cream-border)]/40 text-center">
          <p class="text-[10px] text-[var(--ink-soft)] font-semibold">Total</p>
          <p class="font-display font-bold text-sm">${t.total}</p>
        </div>
      </div>

      <button data-toggle-archive="${key}" class="w-full text-xs font-semibold text-[var(--ink-soft)] py-2 rounded-xl border border-[var(--cream-border)] hover:bg-[var(--cream-border)]/40 transition mb-2">
        ${isExpanded ? 'Hide feed times ▲' : 'View feed times ▼'}
      </button>

      ${isExpanded ? `
        <div class="space-y-1.5 mb-3 max-h-56 overflow-y-auto scrollbar-thin pr-1">
          ${entries.map(e => `
            <div class="flex items-center gap-2.5 py-1.5 px-2 rounded-xl bg-[var(--cream-border)]/30">
              <span class="text-sm">${e.type === 'formula' ? '🍼' : '🤱'}</span>
              <span class="text-xs font-semibold flex-1">${e.type === 'formula' ? 'Formula' : "Mother's"}</span>
              <span class="text-xs font-semibold text-[var(--ink-soft)]">${to12h(e.time)}</span>
              <span class="text-xs font-display font-bold w-14 text-right">${e.amount} ml</span>
            </div>
          `).join('')}
        </div>
      ` : ''}

      <button data-export="${key}" class="w-full text-sm font-semibold text-white py-2 rounded-xl transition active:scale-[0.98]" style="background:var(--pink)">
        ⬇ Download Excel
      </button>
    </div>
  `;
}

/* ---------------- Modal (Add / Edit / Rename) ---------------- */
function renderModal(){
  if (modal.mode === 'rename'){ renderRenameModal(); return; }
  const isEdit = modal.mode === 'edit';
  const e = modal.entry || { type:'formula', amount:'', time: nowHHMM() };
  const wrap = document.createElement('div');
  wrap.id = 'modalRoot';
  wrap.innerHTML = `
    <div class="fixed inset-0 bg-black/40 backdrop-enter flex items-end sm:items-center justify-center z-40 p-0 sm:p-4" id="modalBackdrop">
      <div class="modal-enter w-full sm:max-w-sm card rounded-t-3xl sm:rounded-3xl p-6 pb-8">
        <div class="flex items-center justify-between mb-5">
          <h3 class="font-display font-bold text-lg">${isEdit ? 'Edit Feeding' : 'Add Feeding'}</h3>
          <button id="closeModal" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[var(--cream-border)] text-[var(--ink-soft)]">✕</button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-xs font-semibold text-[var(--ink-soft)] block mb-2">Milk Type</label>
            <div class="grid grid-cols-2 gap-2">
              <button data-type="formula" class="type-btn py-2.5 rounded-xl font-semibold text-sm border-2 transition ${e.type==='formula' ? 'border-[var(--pink)] bg-[var(--pink)]/10' : 'border-[var(--cream-border)]'}">🍼 Formula</button>
              <button data-type="mother" class="type-btn py-2.5 rounded-xl font-semibold text-sm border-2 transition ${e.type==='mother' ? 'border-[var(--pink)] bg-[var(--pink)]/10' : 'border-[var(--cream-border)]'}">🤱 Mother's</button>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-[var(--ink-soft)] block mb-2">Amount (ml)</label>
            <input id="amountInput" type="number" min="1" step="1" value="${e.amount}" placeholder="e.g. 60" class="w-full px-4 py-3 rounded-xl border-2 border-[var(--cream-border)] bg-transparent font-display font-bold text-lg focus:outline-none focus:border-[var(--pink)]" />
          </div>

          <div>
            <label class="text-xs font-semibold text-[var(--ink-soft)] block mb-2">Time</label>
            <input id="timeInput" type="time" value="${e.time}" class="w-full px-4 py-3 rounded-xl border-2 border-[var(--cream-border)] bg-transparent font-semibold focus:outline-none focus:border-[var(--pink)]" />
          </div>
        </div>

        <div class="flex gap-2 mt-6">
          ${isEdit ? `<button id="deleteEntryBtn" class="px-4 py-3 rounded-xl border-2 border-[var(--cream-border)] text-sm font-semibold text-[var(--ink-soft)]">Delete</button>` : ''}
          <button id="saveEntryBtn" class="flex-1 bg-[var(--pink)] hover:bg-[var(--pink-deep)] active:scale-[0.98] transition text-white font-display font-bold py-3 rounded-xl">${isEdit ? 'Save Changes' : 'Add Feeding'}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  let selectedType = e.type;
  wrap.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedType = btn.dataset.type;
      wrap.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('border-[var(--pink)]','bg-[var(--pink)]/10');
        b.classList.add('border-[var(--cream-border)]');
      });
      btn.classList.remove('border-[var(--cream-border)]');
      btn.classList.add('border-[var(--pink)]','bg-[var(--pink)]/10');
    });
  });

  wrap.querySelector('#closeModal').addEventListener('click', closeModal);
  wrap.querySelector('#modalBackdrop').addEventListener('click', (ev) => { if (ev.target.id === 'modalBackdrop') closeModal(); });

  wrap.querySelector('#saveEntryBtn').addEventListener('click', () => {
    const amount = parseInt(document.getElementById('amountInput').value, 10);
    const time = document.getElementById('timeInput').value;
    if (!amount || amount <= 0){ showToast('Enter a valid amount'); return; }
    if (!time){ showToast('Pick a time'); return; }

    const key = todayKey();
    if (!store[key]) store[key] = [];

    if (isEdit){
      const idx = store[key].findIndex(x => x.id === modal.entry.id);
      if (idx > -1){
        store[key][idx] = { ...store[key][idx], type: selectedType, amount, time };
      }
      showToast('Feeding updated');
    } else {
      store[key].push({ id: uid(), type: selectedType, amount, time });
      showToast('Feeding added');
    }
    saveStore(store);
    closeModal();
    render();
  });

  if (isEdit){
    wrap.querySelector('#deleteEntryBtn').addEventListener('click', () => {
      const key = todayKey();
      store[key] = (store[key]||[]).filter(x => x.id !== modal.entry.id);
      saveStore(store);
      showToast('Feeding deleted');
      closeModal();
      render();
    });
  }
}

function closeModal(){
  modal = null;
  const root = document.getElementById('modalRoot');
  if (root) root.remove();
}

function renderRenameModal(){
  const wrap = document.createElement('div');
  wrap.id = 'modalRoot';
  wrap.innerHTML = `
    <div class="fixed inset-0 bg-black/40 backdrop-enter flex items-end sm:items-center justify-center z-40 p-0 sm:p-4" id="modalBackdrop">
      <div class="modal-enter w-full sm:max-w-sm card rounded-t-3xl sm:rounded-3xl p-6 pb-8 text-center">
        <div class="text-3xl mb-2">💙</div>
        <h3 class="font-display font-bold text-lg mb-1">Update your name</h3>
        <p class="text-xs text-[var(--ink-soft)] mb-4">This is used for your greeting on the home screen.</p>
        <input id="renameInput" type="text" maxlength="40" value="${escapeHtml(motherName)}"
          class="w-full px-4 py-3 rounded-xl border-2 border-[var(--cream-border)] bg-transparent font-display font-bold text-lg text-center focus:outline-none focus:border-[var(--pink)] mb-4" />
        <div class="flex gap-2">
          <button id="cancelRenameBtn" class="flex-1 py-3 rounded-xl border-2 border-[var(--cream-border)] text-sm font-semibold text-[var(--ink-soft)]">Cancel</button>
          <button id="saveRenameBtn" class="flex-1 bg-[var(--pink)] hover:bg-[var(--pink-deep)] active:scale-[0.98] transition text-white font-display font-bold py-3 rounded-xl">Save</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  const input = wrap.querySelector('#renameInput');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  wrap.querySelector('#modalBackdrop').addEventListener('click', (ev) => { if (ev.target.id === 'modalBackdrop') closeModal(); });
  wrap.querySelector('#cancelRenameBtn').addEventListener('click', closeModal);
  function submit(){
    const name = input.value.trim();
    if (!name){ showToast('Please enter your name'); return; }
    motherName = name;
    saveMotherName(name);
    closeModal();
    render();
  }
  wrap.querySelector('#saveRenameBtn').addEventListener('click', submit);
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') submit(); });
}

/* ---------------- Event wiring ---------------- */
function attachHomeOrArchiveHandlers(){
  const addBtn = document.getElementById('addBtn');
  if (addBtn) addBtn.addEventListener('click', () => { modal = { mode:'add' }; renderModal(); });

  const renameBtn = document.getElementById('renameBtn');
  if (renameBtn) renameBtn.addEventListener('click', () => { modal = { mode:'rename' }; renderModal(); });

  const syncOpenBtn = document.getElementById('syncOpenBtn');
  if (syncOpenBtn) syncOpenBtn.addEventListener('click', () => { view = 'sync'; render(); });

  document.querySelectorAll('[data-theme-btn]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTheme = btn.dataset.themeBtn;
      saveTheme(currentTheme);
      applyTheme(currentTheme);
      render();
    });
  });

  const archiveBtn = document.getElementById('archiveBtn');
  if (archiveBtn) archiveBtn.addEventListener('click', () => { view = 'archive'; render(); });

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { view = 'home'; render(); });

  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.edit;
      const key = todayKey();
      const entry = (store[key]||[]).find(x => x.id === id);
      if (entry){ modal = { mode:'edit', entry }; renderModal(); }
    });
  });

  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.delete;
      const key = todayKey();
      store[key] = (store[key]||[]).filter(x => x.id !== id);
      saveStore(store);
      showToast('Feeding deleted');
      render();
    });
  });

  document.querySelectorAll('[data-export]').forEach(btn => {
    btn.addEventListener('click', () => exportDay(btn.dataset.export));
  });

  document.querySelectorAll('[data-toggle-archive]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.toggleArchive;
      if (expandedArchiveKeys.has(key)) expandedArchiveKeys.delete(key);
      else expandedArchiveKeys.add(key);
      render();
    });
  });
}

/* ---------------- Midnight rollover ---------------- */
let currentDayKey = todayKey();
setInterval(() => {
  const k = todayKey();
  if (k !== currentDayKey){
    currentDayKey = k;
    if (view === 'home') render();
  }
}, 30000);

/* ---------------- Init ---------------- */
render();
</script>

</html>
